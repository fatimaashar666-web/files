<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clearday Studio – Book an appointment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="#top">Clearday Studio</a>
    <nav>
      <a href="#book">Book</a>
      <a href="#services">Services</a>
      <a href="#bookings">Bookings</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1>Pick a time. We'll take it from there.</h1>
      <p>Choose a service, a day and a free slot. You'll get a confirmation once we review your request.</p>
      <a class="btn" href="#book">Book an appointment</a>
    </section>

    <section id="book" class="section">
      <h2>Book an appointment</h2>
      <form id="booking-form" novalidate>
        <div id="form-message" class="message" role="status" hidden></div>
        <div class="grid">
          <label>Full name
            <input type="text" id="full_name" autocomplete="name" required>
            <small class="error" data-for="full_name"></small>
          </label>
          <label>Email
            <input type="email" id="email" autocomplete="email" required>
            <small class="error" data-for="email"></small>
          </label>
          <label>Phone number
            <input type="tel" id="phone" autocomplete="tel" required>
            <small class="error" data-for="phone"></small>
          </label>
          <label>Service
            <select id="service" required></select>
            <small class="error" data-for="service"></small>
          </label>
          <label>Date
            <input type="date" id="booking_date" required>
            <small class="error" data-for="booking_date"></small>
          </label>
          <label>Time
            <select id="booking_time" required></select>
            <small class="error" data-for="booking_time"></small>
          </label>
        </div>
        <label>Additional notes (optional)
          <textarea id="notes" rows="3"></textarea>
        </label>
        <button class="btn" id="submit-btn" type="submit">Book now</button>
      </form>
    </section>

    <section id="services" class="section">
      <h2>Services</h2>
      <div class="services" id="services-list"></div>
    </section>

    <section id="bookings" class="section">
      <div class="row">
        <h2>Booked slots</h2>
        <button class="link" id="auth-toggle" type="button">Staff sign in</button>
      </div>
      <form id="login-form" hidden>
        <input type="email" id="login-email" placeholder="Admin email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button class="btn small" type="submit">Sign in</button>
      </form>
      <div id="bookings-message" class="message" role="status" hidden></div>
      <div id="bookings-list" class="table-wrap"></div>
    </section>
  </main>

  <footer>© <span id="year"></span> Clearday Studio. All rights reserved.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
